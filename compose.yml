version: "3"
services:
  garmin-livetrack:
    image: ghcr.io/johannes11833/garmin-livetrack-bot:latest
    env_file:
      - .env
    volumes:
      - ./garmin-livetrack-data:/app/garmin-livetrack-data
    depends_on:
      - signal-api

  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      - MODE=normal #supported modes: json-rpc, native, normal
      - AUTO_RECEIVE_SCHEDULE=0 22 * * *
    volumes:
      - "./signal-api-data:/home/.local/share/signal-cli" #map "signal-cli-config" folder on host system into docker container. the folder contains the password and cryptographic keys when a new number is registered

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./garmin_livetrack_viewer/build/web:/srv/viewer:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - garmin-livetrack

volumes:
  caddy_data:
  caddy_config: