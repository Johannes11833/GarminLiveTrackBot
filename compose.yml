version: "3"
services:
  garmin-livetrack:
    build:
      context: .
      dockerfile: Dockerfile.listener
    image: ghcr.io/johannes11833/garmin-livetrack-email-listener:latest
    init: true
    env_file:
      - .env
    environment:
      - LIVETRACK_API_URL=http://garmin-livetrack-api:8000
    volumes:
      - ./garmin-livetrack-data:/app/garmin-livetrack-data
    depends_on:
      - garmin-livetrack-api

  garmin-livetrack-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/johannes11833/garmin-livetrack-api:latest
    env_file:
      - .env
    environment:
      - LIVETRACK_API_HOST=0.0.0.0
    volumes:
      - ./garmin-livetrack-data:/app/garmin-livetrack-data
    ports:
      - 8000:8000
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./garmin_livetrack_viewer/build/web:/srv/viewer:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - garmin-livetrack-api

volumes:
  caddy_data:
  caddy_config: