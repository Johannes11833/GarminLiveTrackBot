server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation, required for the Wasm/Skwasm build to use
    # SharedArrayBuffer and render on a separate thread instead of falling
    # back to single-threaded mode.
    #
    # NOTE: add_header does NOT inherit into a location block that sets any
    # add_header of its own, so these two lines must be repeated in every
    # location below rather than only declared once here.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # nginx's bundled mime.types has no entry for .mjs (the ES module the
    # --wasm build loads main.dart.wasm through), so it falls back to
    # application/octet-stream and Chrome refuses to run it as a module.
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache";
    }

    # Flutter fingerprints/hashes the files under assets/ and canvaskit/, so
    # their content changes URL when it changes -- safe to cache forever.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /canvaskit/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Everything else keeps the same filename across builds (index.html,
        # main.dart.js/.wasm, flutter_bootstrap.js, the service worker, ...),
        # so it must always be revalidated -- otherwise a CDN in front of
        # this (e.g. a Cloudflare Tunnel hostname) or the browser's own
        # cache keeps serving a stale build after every redeploy.
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache";
        # Flutter web is a client-routed SPA: unmatched paths must still
        # resolve to index.html instead of a 404.
        try_files $uri /index.html;
    }
}
