description = ""
authors = ["Johannes <24914225+Johannes11833@users.noreply.github.com>"]
# readme = "README.md" 

[tool.poetry.dependencies]
python = "^3.10"
imapclient = "^3.1.0"
dotenv = "^0.9.9"
requests = "^2.32.5"
